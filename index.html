<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskPulse — Kanban Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-badge">⚡</span>
        <div>
          <h1>TaskPulse</h1>
          <p class="subtitle">Interactive Kanban Workspace</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="branch-pill">🌿 branch: <span id="current-branch-tag">feature/add-task-modal</span></span>
        <button class="btn btn-primary" id="btn-open-modal">+ New Task</button>
      </div>
    </header>

    <main class="board" id="kanban-board">
      <!-- Column: To Do -->
      <section class="column" id="col-todo" data-status="todo">
        <div class="column-header">
          <div class="column-title-group">
            <span class="status-dot dot-todo"></span>
            <h2>To Do</h2>
          </div>
          <span class="task-count" id="count-todo">0</span>
        </div>
        <div class="task-list" id="list-todo">
          <!-- Cards injected via JavaScript -->
        </div>
      </section>

      <!-- Column: In Progress -->
      <section class="column" id="col-in-progress" data-status="in-progress">
        <div class="column-header">
          <div class="column-title-group">
            <span class="status-dot dot-progress"></span>
            <h2>In Progress</h2>
          </div>
          <span class="task-count" id="count-in-progress">0</span>
        </div>
        <div class="task-list" id="list-in-progress">
          <!-- Cards injected via JavaScript -->
        </div>
      </section>

      <!-- Column: Done -->
      <section class="column" id="col-done" data-status="done">
        <div class="column-header">
          <div class="column-title-group">
            <span class="status-dot dot-done"></span>
            <h2>Done</h2>
          </div>
          <span class="task-count" id="count-done">0</span>
        </div>
        <div class="task-list" id="list-done">
          <!-- Cards injected via JavaScript -->
        </div>
      </section>
    </main>
  </div>

  <!-- New Task Modal -->
  <div class="modal-backdrop" id="modal-new-task" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h3>Create New Task</h3>
        <button class="btn-close" id="btn-close-modal" aria-label="Close modal">&times;</button>
      </div>
      <form id="form-new-task">
        <div class="form-group">
          <label for="task-title">Task Title</label>
          <input type="text" id="task-title" required placeholder="e.g., Design user onboarding" />
        </div>
        <div class="form-group">
          <label for="task-desc">Description</label>
          <textarea id="task-desc" rows="3" placeholder="Brief details about what needs to be done..."></textarea>
        </div>
        <div class="form-group">
          <label for="task-priority">Priority</label>
          <select id="task-priority">
            <option value="low">🟢 Low</option>
            <option value="medium" selected>🟡 Medium</option>
            <option value="high">🔴 High</option>
          </select>
        </div>
        <div class="form-group">
          <label for="task-status">Target Column</label>
          <select id="task-status">
            <option value="todo">To Do</option>
            <option value="in-progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel-task">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
